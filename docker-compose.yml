services:
  short-video:
    build: .
    container_name: short-video
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:18083:8080"
    volumes:
      - ./data:/data
    cpus: 0.35
    mem_limit: 256m
    pids_limit: 100
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
